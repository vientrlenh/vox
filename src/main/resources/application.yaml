spring:
  application:
    name: vox

  threads:
    virtual:
      enabled: true
  graphql:
    graphiql:
      enabled: true


  external-events:
    provider: ${EXTERNAL_EVENT_PROVIDER:}
    kafka:
      bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
      client-id: ${KAFKA_CLIENT_ID:vox}
      acks: ${KAFKA_ACKS:all}
      topic-prefix: ${KAFKA_TOPIC_PREFIX:vox}
      topics:
        SendResetPasswordOtpEvent: ${KAFKA_TOPIC_RESET_PASSWORD_OTP:}
        RegisterFormRejectedEvent: ${KAFKA_TOPIC_REGISTER_REJECTED:}
        PasswordSetUpEmailRequestedEvent: ${KAFKA_TOPIC_PASSWORD_SETUP:}
      consumer-groups:
        default:
          group-id: ${KAFKA_GROUP_ID:vox}
          topics: ${KAFKA_CONSUMER_TOPICS:}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: ${REDIS_TIMEOUT:2s}
      
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  security:
    oauth2:
      client:
        registration:
          google: 
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - profile
              - email
          
  datasource:
    url: jdbc:postgresql://${DB_URL}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
  
  storage:
    provider: ${STORAGE_PROVIDER:}
    s3:
      bucket: ${AWS_S3_BUCKET:}
      region: ${AWS_REGION:ap-southeast-1}
      endpoint: ${AWS_S3_ENDPOINT:}
      access-key: ${AWS_ACCESS_KEY_ID:}
      secret-key: ${AWS_SECRET_ACCESS_KEY:}
      key-prefix: ${AWS_S3_KEY_PREFIX:}
      public-base-url: ${AWS_S3_PUBLIC_BASE_URL:}
      path-style-access-enabled: ${AWS_S3_PATH_STYLE:false}

springdoc:
  swagger-ui:
    path: /api-doc.html
    enabled: true
  api-docs:
    path: /v3/api-spec
  

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 1800000

logging:
  level:
    org:
      springframework:
        security: DEBUG

server:
  port: 8080
  shutdown: graceful
  forward-headers-strategy: framework

app:
  frontend:
    password-setup-url: ${PASSWORD_SETUP_URL}
    oauth2-success-url: ${OAUTH2_SUCCESS_URL}
  
  

system-admin:
  email: ${SYS_ADMIN_EMAIL}
  password: ${SYS_ADMIN_PASSWORD}
  phone: ${SYS_ADMIN_PHONE}
  fullName: ${SYS_ADMIN_FULLNAME}
  dateOfBirth: ${SYS_ADMIN_DATE_OF_BIRTH}
  address: ${SYS_ADMIN_ADDRESS}
