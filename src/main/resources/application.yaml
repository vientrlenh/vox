spring:
  application:
    name: vox

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  threads:
    virtual:
      enabled: true
  graphql:
    graphiql:
      enabled: true

  grpc:
    server: 
      port: 9090
      health:
        enabled: true
      reflection:
        enabled: true
          
    client: 
      channel:
        greeter: 
          target: 0.0.0.0:9090
          inbound: 
            message:
              max-size: 8MB
        # vox-streaming chạy trong docker với network_mode: host, còn vox-app ở bridge
        # network riêng -- từ trong container vox, "0.0.0.0" trỏ về CHÍNH NÓ, không bao giờ
        # tới được service kia. Chạy trong compose thì biến này được đặt thành
        # host.docker.internal:9096 (xem docker-compose.yml); mặc định dưới đây dành cho lúc
        # chạy vox thẳng trên máy.
        vox-streaming:
          target: ${VOX_STREAMING_GRPC_TARGET:0.0.0.0:9096}
          inbound: 
            message: 
              max-size: 10MB


  flyway: 
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      acks: all # wait for all replicas
      retries: 3 # retry on transient failure
      batch-size: 16KB # 16KB default
      buffer-memory: 32MB # 32MB producer buffer
      compression-type: zstd # compression-ration=high, speed=fast, cpu-usage=moderate
      properties:
        "[enable.idempotence]": true
    consumer:
      group-id: ${KAFKA_GROUP_ID:vox}
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      max-poll-records: 50 # max records per pools
      max-poll-interval: 10m # 10 min
      fetch-min-size: 1
      fetch-max-wait: 500ms
      auto-offset-reset: earliest
      properties:
        "[spring.json.trusted.packages]": "com.sep.vox"
        "[session.timeout.ms]": 30000
        "[heartbeat.interval.ms]": 10000
        "[spring.deserializer.value.delegate.class]": org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        "[spring.json.use.type.headers]": false
        # Python producers (agents' aiokafka) never send Spring's type-info headers, so
        # JacksonJsonDeserializer has nothing to fall back to and throws IllegalStateException
        # before any @KafkaListener body runs. Fall back to a generic map when headers are
        # absent; listeners already treat record.value() as Object and re-parse it themselves
        # (jsonMapper.valueToTree(...).treeToValue(...)). Headers are still honored when present,
        # so Java-to-Java producers/consumers (e.g. DummyUserRegisteredExternalEvent) are unaffected.
        "[spring.json.value.default.type]": "java.util.LinkedHashMap"

    listener:
      ack-mode: MANUAL_IMMEDIATE # commit right away
      concurrency: 3 # 3 threads
      poll-timeout: 3000ms
      type: single
    streams:
      application-id: "vox"
      auto-startup: true
    properties:
      "[prop.shared]": "value"
    admin:
      properties:
        "[prop.admin]": "value"
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: ${REDIS_TIMEOUT:2s}

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          # Không có timeout thì thread gửi mail treo vô hạn khi SMTP không phản hồi —
          # queue mail đầy dần và (với CallerRunsPolicy) thread import bị giữ luôn.
          connectiontimeout: 5000
          timeout: 10000
          writetimeout: 10000

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - profile
              - email
              - openid

  datasource:
    url: jdbc:postgresql://${DB_URL}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      pool-name: vox-hikari
      # Log kèm stack trace nếu 1 connection bị giữ >5s — cho biết đúng request/repo nào
      # đang ôm connection khiến các request khác phải xếp hàng chờ rồi timeout.
      leak-detection-threshold: 5000
      # Mặc định Spring Boot chỉ 10 — quá ít khi nhiều tab/request đồng thời cùng gọi
      # GraphQL (mỗi request giữ 1 connection suốt thời gian resolve). Postgres cho phép
      # tới 100 connection, còn dư nhiều nên tăng lên đây để giảm nghẽn hàng đợi.
      maximum-pool-size: 25
      minimum-idle: 5

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: true

storage:
  provider: ${STORAGE_PROVIDER:}
  s3:
    ensure-bucket: ${AWS_S3_ENSURE_BUCKET:false}
    public-read: ${AWS_S3_PUBLIC_READ:true}
    uploader-principal-arn: ${AWS_S3_UPLOADER_ARN:}
    fail-on-error: ${AWS_S3_ENSURE_FAIL_FAST:false}
    bucket: ${AWS_S3_BUCKET:}
    region: ${AWS_REGION:ap-southeast-1}
    endpoint: ${AWS_S3_ENDPOINT:}
    access-key: ${AWS_ACCESS_KEY_ID:}
    secret-key: ${AWS_SECRET_ACCESS_KEY:}
    key-prefix: ${AWS_S3_KEY_PREFIX:}
    public-base-url: ${AWS_S3_PUBLIC_BASE_URL:}
    path-style-access-enabled: ${AWS_S3_PATH_STYLE:false}

springdoc:
  swagger-ui:
    path: /api-doc.html
    enabled: true
  api-docs:
    path: /v3/api-spec


jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:900000}
  stream:
    secret: ${JWT_STREAM_SECRET}

logging:
  file: 
    name: logs/vox.log
  logback: 
    rollingpolicy:
      max-file-size: 20MB
      max-history: 7
  level:
    org:
      springframework:
        security: DEBUG
        kafka: WARN
        core: 
          annotation: 
            MergedAnnotation: ERROR
      apache: 
        kafka: WARN


server:
  port: 8081
  shutdown: graceful
  forward-headers-strategy: framework
  ssl: 
    enabled: ${SSL_ENABLED:false}
    certificate: ${SSL_CERT_PATH:}
    certificate-private-key: ${SSL_KEY_PATH:}

practice:
  internal:
    secret: ${PRACTICE_INTERNAL_SECRET:}

app:
  grpc:
    # Bí mật dùng chung gắn vào mọi lời gọi gRPC sang vox-streaming (xem
    # StreamingServiceTokenInterceptor). Phải trùng GRPC_SERVICE_TOKEN bên vox-streaming.
    # Rỗng thì interceptor KHÔNG gắn header, và vox-streaming trả UNAUTHENTICATED với lý do
    # đọc được -- hơn là gắn "Bearer " cụt rồi nhận PERMISSION_DENIED, hai lỗi đó dẫn người
    # đọc log đi hai hướng khác nhau.
    streaming-token: ${GRPC_SERVICE_TOKEN:}
  cors:
    # Chỉ những origin liệt kê ở đây gọi được API. Mặc định là các cổng dev quen thuộc
    # để clone repo về là chạy được ngay; mỗi môi trường triển khai phải tự đặt
    # CORS_ALLOWED_ORIGINS (phân tách bằng dấu phẩy), KHÔNG sửa dòng này.
    # Ghi đúng dạng scheme://host[:port] -- thừa '/' ở cuối hay kèm path là app không
    # khởi động, xem SecurityConfig#validatedAllowedOrigins.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  cookie:
    secure: ${COOKIE_SECURE:false} # Local dev use false
    same-site: ${COOKIE_SAME_SITE:Lax} # If using domain forward, make this as None
  data-initializer:
    enabled: ${DATA_INITIALIZER:true}
  practice:
    heartbeat-cleanup-ms: ${PRACTICE_HEARTBEAT_CLEANUP_MS:30000}
  personalization:
   
    quiz:
     item-count: ${PERSONALIZATION_QUIZ_ITEM_COUNT:7}
    generation:
      paper-target-question-count: ${PERSONALIZATION_PAPER_TARGET_QUESTION_COUNT:4}
      online-candidate-count: ${PERSONALIZATION_ONLINE_CANDIDATE_COUNT:2}
      online-budget: ${PERSONALIZATION_ONLINE_GENERATION_BUDGET:45s}
  frontend:
    password-setup-url: ${PASSWORD_SETUP_URL}
    oauth2-url: ${OAUTH2_URL}
  external-event:
    kafka:
      consumer-groups:
        user-service:
          topic:
            user-registered: ${KAFKA_USER_TOPIC:user.registered.v1}
          group-id: ${KAFKA_USER_GROUP_ID:vox-user}
        answer-turns:
          topic:
            answer-turns-recorded: ${KAFKA_ANSWER_TURNS_TOPIC:answer-turns-recorded}
          group-id: ${KAFKA_ANSWER_TURNS_GROUP_ID:vox-answer-turns}
        exam-evaluation:
          topic:
            exam-attempt-evaluation-completed: ${KAFKA_EXAM_EVALUATION_COMPLETED_TOPIC:exam-attempt-evaluation-completed}
          group-id: ${KAFKA_EXAM_EVALUATION_GROUP_ID:vox-exam-evaluation}
        practice-evaluation:
          topic:
            practice-attempt-evaluation-completed: ${KAFKA_PRACTICE_EVALUATION_COMPLETED_TOPIC:practice-attempt-evaluation-completed}
          group-id: ${KAFKA_PRACTICE_EVALUATION_GROUP_ID:vox-practice-evaluation}
        question-asset-analysis:
          topic:
            question-asset-analysis-completed: ${KAFKA_QUESTION_ASSET_ANALYSIS_COMPLETED_TOPIC:question-asset-analysis-completed}
          group-id: ${KAFKA_QUESTION_ASSET_ANALYSIS_GROUP_ID:vox-question-asset-analysis}
        recording:
          topic:
            recording-part-changed: ${KAFKA_RECORDING_PART_CHANGED_TOPIC:exam.recording.part.changed}
          group-id: ${KAFKA_RECORDING_GROUP_ID:vox-recording}
        ai-usage:
          topic:
            ai-usage-recorded: ${KAFKA_AI_USAGE_TOPIC:exam-ai-usage-recorded}
          group-id: ${KAFKA_AI_USAGE_GROUP_ID:vox-ai-usage}
  internal-event:
    kafka: 
      consumer-groups:
        email:
          topic: 
            register-form-rejected: ${KAFKA_REGISTER_FORM_REJECTED_TOPIC:vox.register-form-rejected.v1}
            user-created: ${KAFKA_USER_CREATED_TOPIC:vox.user-created.v1}
            exam-appeal: ${KAFKA_EXAM_APPEAL_TOPIC:vox.exam-appeal.v1}
            exam-result-lifecycle: ${KAFKA_EXAM_RESULT_LIFECYCLE_TOPIC:vox.exam-result-lifecycle.v1}
            grading-assignment: ${KAFKA_GRADING_ASSIGNMENT_TOPIC:vox.grading-assignment.v1}
            invoice: ${KAFKA_INVOICE_TOPIC:vox.invoice.v1}
            school-debt: ${KAFKA_SCHOOL_DEBT_TOPIC:vox.school-debt.v1}
            # Hai topic OTP chỉ email đọc. Payload của chúng KHÔNG chứa mã OTP -- mã được
            # sinh tại consumer ngay trước lúc gửi mail, xem EventTypeConstant.
            reset-password-otp: ${KAFKA_RESET_PASSWORD_OTP_TOPIC:vox.reset-password-otp.v1}
            register-verification-otp: ${KAFKA_REGISTER_VERIFICATION_OTP_TOPIC:vox.register-verification-otp.v1}
          group-id: ${KAFKA_EMAIL_GROUP_ID:vox-email}
        # Cố tình dùng LẠI biến môi trường topic của email: hai nhóm phải luôn đọc cùng
        # một topic, tách biến ra là có ngày đổi một bên rồi lệch nhau trong im lặng.
        # Vắng register-form-rejected và user-created là có chủ ý: người nhận chưa có tài
        # khoản / chưa từng đăng nhập nên không có thiết bị nào để đẩy.
        notification:
          topic:
            exam-appeal: ${KAFKA_EXAM_APPEAL_TOPIC:vox.exam-appeal.v1}
            exam-result-lifecycle: ${KAFKA_EXAM_RESULT_LIFECYCLE_TOPIC:vox.exam-result-lifecycle.v1}
            grading-assignment: ${KAFKA_GRADING_ASSIGNMENT_TOPIC:vox.grading-assignment.v1}
            exam-blueprint-version: ${KAFKA_EXAM_BLUEPRINT_VERSION_TOPIC:vox.exam-blueprint-version.v1}
            invoice: ${KAFKA_INVOICE_TOPIC:vox.invoice.v1}
            school-debt: ${KAFKA_SCHOOL_DEBT_TOPIC:vox.school-debt.v1}
          # Ngược lại, group-id BẮT BUỘC phải là biến riêng. Dùng chung KAFKA_EMAIL_GROUP_ID
          # thì khi biến đó được set, hai listener rơi vào cùng một consumer group và Kafka
          # chỉ giao mỗi message cho MỘT trong hai -- mail hoặc notification, ngẫu nhiên.
          group-id: ${KAFKA_NOTIFICATION_GROUP_ID:vox-notification}
  notification:
    # Thiết bị biến mất lặng lẽ (gỡ app mà không đăng xuất, xoá dữ liệu trình duyệt) sẽ
    # không bao giờ nhận được UNREGISTERED từ FCM, nên đây là đường dọn duy nhất của chúng.
    # Đặt 0 để tắt job.
    device-retention-days: ${NOTIFICATION_DEVICE_RETENTION_DAYS:90}
  recording:
    bucket: ${RECORDING_S3_BUCKET:}
  outbox:
    # Nhiều eventType trỏ chung một topic là có chủ ý: consumer phân nhánh bằng header
    # eventType, nên gom theo nhóm nghiệp vụ mà mỗi loại vẫn giữ payload riêng.
    # Thiếu một key ở đây so với EventTypeConstant.all() là app không khởi động được.
    topics:
      "[RegisterFormRejected]": ${KAFKA_REGISTER_FORM_REJECTED_TOPIC:vox.register-form-rejected.v1}
      "[UserCreated]": ${KAFKA_USER_CREATED_TOPIC:vox.user-created.v1}

      "[ExamAppealPublished]": ${KAFKA_EXAM_APPEAL_TOPIC:vox.exam-appeal.v1}
      "[ExamAppealRejected]": ${KAFKA_EXAM_APPEAL_TOPIC:vox.exam-appeal.v1}
      "[ExamAppealApproved]": ${KAFKA_EXAM_APPEAL_TOPIC:vox.exam-appeal.v1}

      "[ExamResultReleased]": ${KAFKA_EXAM_RESULT_LIFECYCLE_TOPIC:vox.exam-result-lifecycle.v1}
      "[ExamResultRegraded]": ${KAFKA_EXAM_RESULT_LIFECYCLE_TOPIC:vox.exam-result-lifecycle.v1}
      "[ExamResultInvalidated]": ${KAFKA_EXAM_RESULT_LIFECYCLE_TOPIC:vox.exam-result-lifecycle.v1}
      "[ExamResultInvalidCleared]": ${KAFKA_EXAM_RESULT_LIFECYCLE_TOPIC:vox.exam-result-lifecycle.v1}
      "[ExamResultOutcomeDecided]": ${KAFKA_EXAM_RESULT_LIFECYCLE_TOPIC:vox.exam-result-lifecycle.v1}

      "[GradingDeadlineReminder]": ${KAFKA_GRADING_ASSIGNMENT_TOPIC:vox.grading-assignment.v1}
      "[GradingAssignmentDeclined]": ${KAFKA_GRADING_ASSIGNMENT_TOPIC:vox.grading-assignment.v1}

      "[ExamBlueprintVersionPublished]": ${KAFKA_EXAM_BLUEPRINT_VERSION_TOPIC:vox.exam-blueprint-version.v1}

      "[InvoicePaid]": ${KAFKA_INVOICE_TOPIC:vox.invoice.v1}

      "[SchoolDebtCapExceeded]": ${KAFKA_SCHOOL_DEBT_TOPIC:vox.school-debt.v1}
      "[SchoolLockedDueToDebt]": ${KAFKA_SCHOOL_DEBT_TOPIC:vox.school-debt.v1}
      "[SchoolDebtCleared]": ${KAFKA_SCHOOL_DEBT_TOPIC:vox.school-debt.v1}

      # Hai event OTP: payload chỉ mang địa chỉ nhận, mã sinh ở consumer.
      "[ResetPasswordOtpRequested]": ${KAFKA_RESET_PASSWORD_OTP_TOPIC:vox.reset-password-otp.v1}
      "[RegisterVerificationOtpRequested]": ${KAFKA_REGISTER_VERIFICATION_OTP_TOPIC:vox.register-verification-otp.v1}
    


system-admin:
  email: ${SYS_ADMIN_EMAIL}
  password: ${SYS_ADMIN_PASSWORD}
  phone: ${SYS_ADMIN_PHONE}
  fullName: ${SYS_ADMIN_FULLNAME}
  dateOfBirth: ${SYS_ADMIN_DATE_OF_BIRTH}
  address: ${SYS_ADMIN_ADDRESS}

payos:
  client-id: ${PAYOS_CLIENT_ID:}
  api-key: ${PAYOS_API_KEY:}
  checksum-key: ${PAYOS_CHECKSUM_KEY:}
  return-url: ${PAYOS_RETURN_URL:}
  cancel-url: ${PAYOS_CANCEL_URL:}              

vox:
  quota:
    # PLACEHOLDER: dùng để ước lượng worst-case chi phí AI (USD) trước khi cho phép
    # lên lịch kỳ thi -- xem ClassTestTokenQuotaGuardService. Đây KHÔNG phải chi phí
    # thật (chi phí thật lấy từ ai_usage_record.cost_usd sau khi Agentic AI xử lý
    # xong), chỉ là hệ số quy đổi tạm để chặn sớm khi trường rõ ràng không đủ hạn
    # mức. Cần thay bằng số đo thực tế (trung bình cost_usd / audio_duration_seconds
    # trên một khoảng thời gian đủ dài) trước khi dùng ở production..
    estimated-cost-per-exam-second-usd: ${VOX_QUOTA_ESTIMATED_COST_PER_EXAM_SECOND_USD:}
    # Cùng vai trò như dòng trên nhưng riêng cho PRACTICE -- tự tính lại độc lập qua
    # QuotaPricingCalibrationJob.runPractice(), xem QuotaPricingCalibrationService/QuotaPricingSource.
    estimated-cost-per-practice-second-usd: ${VOX_QUOTA_ESTIMATED_COST_PER_PRACTICE_SECOND_USD:}
    calibration:
      # QuotaPricingCalibrationJob dùng các số này để tự tính lại estimated-cost-per-exam-second-usd
      # ở trên từ dữ liệu ai_usage_record/exam_item_responses thật, thay vì phải tự sửa .env tay --
      # xem QuotaPricingCalibrationService.
      window-days: ${VOX_QUOTA_CALIBRATION_WINDOW_DAYS:}
      min-sample-sessions: ${VOX_QUOTA_CALIBRATION_MIN_SAMPLE_SESSIONS:}
      max-change-ratio: ${VOX_QUOTA_CALIBRATION_MAX_CHANGE_RATIO:}
      min-rate-bound: ${VOX_QUOTA_CALIBRATION_MIN_RATE_BOUND:}
      max-rate-bound: ${VOX_QUOTA_CALIBRATION_MAX_RATE_BOUND:}
    debt:
      # Trần cảnh báo (KHÔNG chặn) khi nợ (usedQuantity - totalAllocated) vượt tỉ lệ này so với
      # totalAllocated -- xem QuotaDebtProperties/SchoolSubscriptionDebtGuardService.
      cap-ratio: ${VOX_QUOTA_DEBT_CAP_RATIO:}
    selling-price:
      # Tỷ giá USD->VND để FE tự tính giá gợi ý bán quota, kết hợp với serviceFeeRatio riêng của
      # từng SubscriptionPlan -- xem QuotaSellingPriceProperties/QuotaPricingService.
      usd-to-vnd-rate: ${VOX_QUOTA_USD_TO_VND_RATE:}

sepay:
  pg:
    # SANDBOX | PRODUCTION. URL của trang checkout và của Open API được suy ra từ đây (xem
    # SePayPaymentProperties.SePayEnvironment) — hai URL đó luôn phải cùng môi trường, khai rời
    # từng cái là mở đường cho việc deploy quên đổi một dòng.
    env: ${SEPAY_ENV:SANDBOX}
    merchant-id: ${SEPAY_MERCHANT_ID:}
    # Khóa ký HMAC của form checkout, đồng thời là password Basic auth khi gọi Open API.
    secret-key: ${SEPAY_SECRET_KEY:}
    # Giá trị header X-Secret-Key trên IPN, đặt riêng ở dashboard (Payment Gateway -> Cấu hình ->
    # IPN). KHÔNG dùng lại secret-key: làm vậy là gửi khóa ký qua mạng ở mọi lần SePay gọi IPN.
    ipn-secret-key: ${SEPAY_IPN_SECRET_KEY:}
    # BANK_TRANSFER (VietQR) | NAPAS_BANK_TRANSFER | CARD
    payment-method: ${SEPAY_PAYMENT_METHOD:BANK_TRANSFER}
    # Gốc của các route FE /payment/success|error|cancel mà SePay redirect người dùng về.
    return-base-url: ${SEPAY_RETURN_BASE_URL:${BASE_URL:}}

firebase:
  # Tắt mặc định: bean FirebaseApp ném lỗi khi không có service account, nên nếu bật
  # sẵn thì mọi máy chưa cấu hình credentials sẽ không khởi động được app lẫn test.
  # Khi tắt, NoOpPushNotificationService đứng thay PushNotificationPort.
  enabled: ${FIREBASE_ENABLED:false}
  credentials:
    # Đường dẫn tới file service account .json. Chấp nhận đường dẫn tuyệt đối trần
    # (C:\... hoặc /etc/...) -- FirebaseConfig tự thêm scheme file: -- và cả dạng có
    # sẵn scheme như classpath:firebase/service-account.json.
    # Lưu ý phải trỏ tới CHÍNH FILE .json, không phải thư mục chứa nó.
    path: ${FIREBASE_CREDENTIALS_PATH:}
    # Thay thế cho path khi deploy bằng container không mount được file: dán thẳng
    # nội dung service account, dạng JSON thô hoặc base64.
    json: ${FIREBASE_CREDENTIALS_JSON:}

demo-data: 
  enabled: ${DEMO_DATA_ENABLED:false}
  password: ${DEMO_DATA_PASSWORD:Password@123}