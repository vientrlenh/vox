spring:
  application:
    name: vox

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  threads:
    virtual:
      enabled: true
  graphql:
    graphiql:
      enabled: true

  grpc:
    server: 
      port: 9090
      health:
        enabled: true
      reflection:
        enabled: true
          
    client: 
      channel:
        greeter: 
          target: 0.0.0.0:9090
          inbound: 
            message:
              max-size: 8MB

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      acks: all # wait for all replicas
      retries: 3 # retry on transient failure
      batch-size: 16KB # 16KB default
      buffer-memory: 32MB # 32MB producer buffer
      compression-type: zstd # compression-ration=high, speed=fast, cpu-usage=moderate
      properties:
        "[enable.idempotence]": true
    consumer:
      group-id: ${KAFKA_GROUP_ID:vox}
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      max-poll-records: 50 # max records per pools
      max-poll-interval: 10m # 10 min
      fetch-min-size: 1
      fetch-max-wait: 500ms
      auto-offset-reset: earliest
      properties:
        "[spring.json.trusted.packages]": "com.sep.vox"
        "[session.timeout.ms]": 30000
        "[heartbeat.interval.ms]": 10000

    listener:
      ack-mode: MANUAL_IMMEDIATE # commit right away
      concurrency: 3 # 3 threads
      poll-timeout: 3000ms
      type: single
    streams:
      application-id: "vox"
      auto-startup: true
    properties:
      "[prop.shared]": "value"
    admin:
      properties:
        "[prop.admin]": "value"
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: ${REDIS_TIMEOUT:2s}

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - profile
              - email
              - openid

  datasource:
    url: jdbc:postgresql://${DB_URL}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true

storage:
  provider: ${STORAGE_PROVIDER:}
  s3:
    bucket: ${AWS_S3_BUCKET:}
    region: ${AWS_REGION:ap-southeast-1}
    endpoint: ${AWS_S3_ENDPOINT:}
    access-key: ${AWS_ACCESS_KEY_ID:}
    secret-key: ${AWS_SECRET_ACCESS_KEY:}
    key-prefix: ${AWS_S3_KEY_PREFIX:}
    public-base-url: ${AWS_S3_PUBLIC_BASE_URL:}
    path-style-access-enabled: ${AWS_S3_PATH_STYLE:false}

springdoc:
  swagger-ui:
    path: /api-doc.html
    enabled: true
  api-docs:
    path: /v3/api-spec


jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 1800000
  stream:
    secret: ${JWT_STREAM_SECRET}

logging:
  level:
    org:
      springframework:
        security: DEBUG
        kafka: WARN
        core: 
          annotation: 
            MergedAnnotation: ERROR
      apache: 
        kafka: WARN


server:
  port: 8081
  shutdown: graceful
  forward-headers-strategy: framework

app:
  frontend:
    password-setup-url: ${PASSWORD_SETUP_URL}
    oauth2-url: ${OAUTH2_URL}
  external-event:
    kafka:
      consumer-groups:
        user-service:
          topic:
            user-registered: ${KAFKA_USER_TOPIC:user.registered.v1}
          group-id: ${KAFKA_USER_GROUP_ID:vox-user}

system-admin:
  email: ${SYS_ADMIN_EMAIL}
  password: ${SYS_ADMIN_PASSWORD}
  phone: ${SYS_ADMIN_PHONE}
  fullName: ${SYS_ADMIN_FULLNAME}
  dateOfBirth: ${SYS_ADMIN_DATE_OF_BIRTH}
  address: ${SYS_ADMIN_ADDRESS}

payos:
  client-id: ${PAYOS_CLIENT_ID:}
  api-key: ${PAYOS_API_KEY:}
  checksum-key: ${PAYOS_CHECKSUM_KEY:}
  return-url: ${PAYOS_RETURN_URL:}
  cancel-url: ${PAYOS_CANCEL_URL:}