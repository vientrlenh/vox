spring:
  application:
    name: vox

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  threads:
    virtual:
      enabled: true
  graphql:
    graphiql:
      enabled: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      acks: all # wait for all replicas
      retries: 3 # retry on transient failure
      batch-size: 16384 # 16KB default
      buffer-memory: 33554432 # 32MB producer buffer
      compression-type: zstd # compression-ration=high, speed=fast, cpu-usage=moderate
      properties:
        enable:
          idempotence: true
      transaction-id-prefix: tx- # transactional producer
    consumer:
      group-id: ${KAFKA_GROUP_ID:vox}
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer 
      max-poll-records: 500 # max records per pools 
      fetch-min-size: 1
      fetch-max-wait: 500ms
      properties:
        spring:
          json:
            trusted:
              packages: "*"
        session:
          timeout:
            ms: 30000
        heartbeat: 
          interval:
            ms: 10000
      auto-offset-reset: earliest
      isolation-level: read-committed # only read committed messages
    listener:
      ack-mode: MANUAL_IMMEDIATE # commit right away
      concurrency: 3
      poll-timeout: 3000ms
      type: single
    streams:
      application-id: "vox"
      auto-startup: true
    properties: 
      "[prop.shared]": "value"
    admin: 
      properties: 
        "[prop.admin]": "value"
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: ${REDIS_TIMEOUT:2s}

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - profile
              - email

  datasource:
    url: jdbc:postgresql://${DB_URL}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true

  storage:
    provider: ${STORAGE_PROVIDER:}
    s3:
      bucket: ${AWS_S3_BUCKET:}
      region: ${AWS_REGION:ap-southeast-1}
      endpoint: ${AWS_S3_ENDPOINT:}
      access-key: ${AWS_ACCESS_KEY_ID:}
      secret-key: ${AWS_SECRET_ACCESS_KEY:}
      key-prefix: ${AWS_S3_KEY_PREFIX:}
      public-base-url: ${AWS_S3_PUBLIC_BASE_URL:}
      path-style-access-enabled: ${AWS_S3_PATH_STYLE:false}

springdoc:
  swagger-ui:
    path: /api-doc.html
    enabled: true
  api-docs:
    path: /v3/api-spec


jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 1800000

logging:
  level:
    org:
      springframework:
        security: DEBUG

server:
  port: 8080
  shutdown: graceful
  forward-headers-strategy: framework

app:
  external-events:
    topic-prefix: ${KAFKA_TOPIC_PREFIX:vox}
    consumer-groups:
      user-service:
        group-id: ${KAFKA_USER_GROUP_ID:vox-user}
        topics: ${KAFKA_CONSUMER_TOPIC_USER:user-events}
      notification-service:
        group-id: ${KAFKA_NOTIFICATION_GROUP_ID:vox-notification}
        topics: ${KAFKA_CONSUMER_TOPIC_NOTIFICATION:notifications}
      audit-service:
        group-id: ${KAFKA_AUDIT_GROUP_ID:vox-audit}
        topics: ${KAFKA_CONSUMER_TOPIC_AUDIT:audit-events}

  frontend:
    password-setup-url: ${PASSWORD_SETUP_URL}
    oauth2-success-url: ${OAUTH2_SUCCESS_URL}

system-admin:
  email: ${SYS_ADMIN_EMAIL}
  password: ${SYS_ADMIN_PASSWORD}
  phone: ${SYS_ADMIN_PHONE}
  fullName: ${SYS_ADMIN_FULLNAME}
  dateOfBirth: ${SYS_ADMIN_DATE_OF_BIRTH}
  address: ${SYS_ADMIN_ADDRESS}
