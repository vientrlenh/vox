spring:
  application:
    name: vox
  
  boot:
    admin:
      # Root path of the SBA server: every @AdminController (including POST /instances for registration)
      # is remapped to /admin/**, see AdminControllerHandlerMapping.
      context-path: /admin
      client:
        # MUST include the context-path above. The client appends "/instances" to this url itself
        # (ClientProperties.apiPath), so without /admin it POSTs straight to /instances -> 404.
        url: http://localhost:8081/admin
        # Basic account the client attaches to the registration request. Points at app.admin.* at the end of the file so
        # that there is only ONE place to change -- if the two sides differ the client is stuck on 401 and retries
        # every 10 seconds, filling the log without saying that the password is wrong.
        username: ${app.admin.username}
        password: ${app.admin.password}
        # Conversely, this is the URL of THIS app itself, which the SBA server calls to reach the actuator -- no /admin.
        instance:
          service-url: http://localhost:8081

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  jackson:
    mapper:
      accept-case-insensitive-enums: true

  threads:
    virtual:
      enabled: true
  graphql:
    graphiql:
      enabled: true

  grpc:
    server: 
      port: 9090
      health:
        enabled: true
      reflection:
        enabled: true
          
    client: 
      channel:
        greeter: 
          target: 0.0.0.0:9090
          inbound: 
            message:
              max-size: 8MB
        # vox-streaming runs in docker with network_mode: host, while vox-app is on its own bridge
        # network -- from inside the vox container, "0.0.0.0" points at ITSELF and never
        # reaches the other service. When running in compose this variable is set to
        # host.docker.internal:9096 (see docker-compose.yml); the default below is for
        # running vox directly on the machine.
        vox-streaming:
          target: ${VOX_STREAMING_GRPC_TARGET:0.0.0.0:9096}
          inbound: 
            message: 
              max-size: 10MB


  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    # Gate that WIPES THE DB, locked by default.
    #
    # V1 is now a merged baseline replacing all of the old V1..V44. Every database that ever ran the old
    # migration chain holds the old V1 checksum in flyway_schema_history, so Flyway will
    # refuse to start with "Migration checksum mismatch for version 1".
    #
    # How to rebuild a dev DB: run EXACTLY ONCE with these two variables enabled, Flyway drops the schema
    # completely and rebuilds it from V1, then remove the variables:
    #
    #   FLYWAY_CLEAN_DISABLED=false FLYWAY_CLEAN_ON_VALIDATION_ERROR=true ./gradlew bootRun
    #
    # For a DB run by docker-compose the tidier way is to delete the volume:
    #   docker compose down -v && docker compose up -d postgres
    #
    # Do NOT flip the defaults to true/false: there is a single application.yaml shared by
    # every environment, and clean-on-validation-error deletes all data without asking again.
    # Enabling it by default in this file would plant a mine for production.
    clean-disabled: ${FLYWAY_CLEAN_DISABLED:true}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      acks: all # wait for all replicas
      retries: 3 # retry on transient failure
      batch-size: 16KB # 16KB default
      buffer-memory: 32MB # 32MB producer buffer
      compression-type: zstd # compression-ration=high, speed=fast, cpu-usage=moderate
      properties:
        "[enable.idempotence]": true
    consumer:
      group-id: ${KAFKA_GROUP_ID:vox}
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      max-poll-records: 50 # max records per pools
      max-poll-interval: 10m # 10 min
      fetch-min-size: 1
      fetch-max-wait: 500ms
      auto-offset-reset: earliest
      properties:
        "[spring.json.trusted.packages]": "com.sep.vox"
        "[session.timeout.ms]": 30000
        "[heartbeat.interval.ms]": 10000
        "[spring.deserializer.value.delegate.class]": org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        "[spring.json.use.type.headers]": false
        # Python producers (agents' aiokafka) never send Spring's type-info headers, so
        # JacksonJsonDeserializer has nothing to fall back to and throws IllegalStateException
        # before any @KafkaListener body runs. Fall back to a generic map when headers are
        # absent; listeners already treat record.value() as Object and re-parse it themselves
        # (jsonMapper.valueToTree(...).treeToValue(...)). Headers are still honored when present,
        # so Java-to-Java producers/consumers (e.g. DummyUserRegisteredExternalEvent) are unaffected.
        "[spring.json.value.default.type]": "java.util.LinkedHashMap"

    listener:
      ack-mode: MANUAL_IMMEDIATE # commit right away
      concurrency: 3 # 3 threads
      poll-timeout: 3000ms
      type: single
    streams:
      application-id: "vox"
      auto-startup: true
    properties:
      "[prop.shared]": "value"
    admin:
      properties:
        "[prop.admin]": "value"
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: ${REDIS_TIMEOUT:2s}

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          # Without a timeout the mail-sending thread hangs forever when SMTP does not respond --
          # the mail queue fills up and (with CallerRunsPolicy) the import thread is held as well.
          connectiontimeout: 5000
          timeout: 10000
          writetimeout: 10000

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - profile
              - email
              - openid

  datasource:
    url: jdbc:postgresql://${DB_URL}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      pool-name: vox-hikari
      # Log with a stack trace if a connection is held for more than 5s -- shows exactly which request/repo
      # is hogging a connection while other requests queue up and then time out.
      leak-detection-threshold: 5000
      # Spring Boot's default is only 10 -- too few when many tabs/requests call
      # GraphQL concurrently (each request holds 1 connection for the whole resolve time). Postgres allows
      # up to 100 connections, with plenty to spare, so it is raised here to reduce queue congestion.
      maximum-pool-size: 25
      minimum-idle: 5

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: true

management: 
  endpoints: 
    web: 
      exposure: 
        include: "*"
  endpoint: 
    health: 
      show-details: always
  health: 
    mail: 
      enabled: false

storage:
  provider: ${STORAGE_PROVIDER:}
  s3:
    ensure-bucket: ${AWS_S3_ENSURE_BUCKET:false}
    public-read: ${AWS_S3_PUBLIC_READ:true}
    uploader-principal-arn: ${AWS_S3_UPLOADER_ARN:}
    fail-on-error: ${AWS_S3_ENSURE_FAIL_FAST:false}
    bucket: ${AWS_S3_BUCKET:}
    region: ${AWS_REGION:ap-southeast-1}
    endpoint: ${AWS_S3_ENDPOINT:}
    access-key: ${AWS_ACCESS_KEY_ID:}
    secret-key: ${AWS_SECRET_ACCESS_KEY:}
    key-prefix: ${AWS_S3_KEY_PREFIX:}
    public-base-url: ${AWS_S3_PUBLIC_BASE_URL:}
    path-style-access-enabled: ${AWS_S3_PATH_STYLE:false}

springdoc:
  swagger-ui:
    path: /api-doc.html
    enabled: true
  api-docs:
    path: /v3/api-spec


jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:900000}
  stream:
    secret: ${JWT_STREAM_SECRET}

logging:
  file: 
    name: logs/vox.log
  logback: 
    rollingpolicy:
      max-file-size: 20MB
      max-history: 7
  level:
    org:
      springframework:
        security: DEBUG
        kafka: WARN
        core: 
          annotation: 
            MergedAnnotation: ERROR
      apache: 
        kafka: WARN


server:
  port: 8081
  shutdown: graceful
  forward-headers-strategy: framework
  ssl: 
    enabled: ${SSL_ENABLED:false}
    certificate: ${SSL_CERT_PATH:}
    certificate-private-key: ${SSL_KEY_PATH:}

practice:
  internal:
    secret: ${PRACTICE_INTERNAL_SECRET:}

app:
  avatar:
    # Hosts allowed in users.avatar_url, separated by commas.
    #
    # Avatars are uploaded by the CLIENT itself to its own storage (currently Firebase Storage) and only a URL
    # string is sent here -- the backend receives no file, so this string is the only thing it can check. If left empty
    # the only remaining constraint is "must be an https URL", which means a user can point the image at any
    # server, and every teacher opening a grading list then calls that server automatically (leaking IP and view time,
    # and the host owner can change the image behind our back).
    #
    # Leaving it empty accepts that trade-off -- convenient in dev, should NOT be kept in a real environment. For
    # Firebase Storage, the host to fill in is firebasestorage.googleapis.com.
    allowed-hosts: ${AVATAR_ALLOWED_HOSTS:}
  admin:
    # HTTP Basic account for /admin/** (the Spring Boot Admin page + registration endpoint).
    # NO default value: behind this gate sit the actuators of every registered instance, plus a
    # write proxy to them. If a variable is missing the app stops right at startup with a message,
    # see SecurityConfig#requireConfigured.
    username: ${SBA_ADMIN_USERNAME:}
    password: ${SBA_ADMIN_PASSWORD:}
  mail:
    # Sender address. REQUIRED: without it JavaMail derives a local address from
    # user.name + the hostname of the machine, and when it cannot derive one it throws
    # "can't determine local email address" -- no mail can be sent at all.
    #
    # Defaults to the SMTP account being authenticated. For Gmail this is almost mandatory: setting a from address
    # different from the login account makes Gmail either overwrite it or refuse to send.
    from: ${MAIL_FROM:${spring.mail.username}}
    # Display name in the recipient's mailbox, does not affect sending.
    from-display-name: ${MAIL_FROM_DISPLAY_NAME:VOX}
  grpc:
    # Shared secret attached to every gRPC call to vox-streaming (see
    # StreamingServiceTokenInterceptor). Must match GRPC_SERVICE_TOKEN on the vox-streaming side.
    # If empty the interceptor does NOT attach the header, and vox-streaming returns UNAUTHENTICATED with a
    # readable reason -- better than attaching a truncated "Bearer " and getting PERMISSION_DENIED, since those two errors send the
    # log reader in two different directions.
    streaming-token: ${GRPC_SERVICE_TOKEN:}
  cors:
    # Only the origins listed here may call the API. The default is the usual dev ports
    # so that a fresh clone runs right away; every deployment environment must set
    # CORS_ALLOWED_ORIGINS itself (comma separated), do NOT edit this line.
    # Write them exactly as scheme://host[:port] -- a trailing '/' or a path stops the app from
    # starting, see SecurityConfig#validatedAllowedOrigins.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  cookie:
    secure: ${COOKIE_SECURE:false} # Local dev use false
    same-site: ${COOKIE_SAME_SITE:Lax} # If using domain forward, make this as None
    # Domain of the XSRF-TOKEN cookie (SecurityConfig#apiCsrfTokenRepository).
    #
    # EMPTY when running locally: a host-only cookie is enough because the frontend (localhost:5173) and the backend
    # (localhost:8081) share the host "localhost" -- cookies do not distinguish ports.
    #
    # On a deployment it MUST be set to ".voxenta.net": the backend returns the cookie from api.voxenta.net, while the JS
    # that reads it runs on voxenta.net, and with a host-only cookie document.cookie on the other side
    # cannot see it. Without this line axios cannot attach the X-XSRF-TOKEN header and every call to
    # /api/v1/auth/refresh returns 403 -- users are kicked back to login every time the access token expires.
    domain: ${COOKIE_DOMAIN:}
  data-initializer:
    enabled: ${DATA_INITIALIZER:true}
  practice:
    heartbeat-cleanup-ms: ${PRACTICE_HEARTBEAT_CLEANUP_MS:30000}
  personalization:
   
    quiz:
     item-count: ${PERSONALIZATION_QUIZ_ITEM_COUNT:7}
    generation:
      paper-target-question-count: ${PERSONALIZATION_PAPER_TARGET_QUESTION_COUNT:4}
      online-candidate-count: ${PERSONALIZATION_ONLINE_CANDIDATE_COUNT:2}
      online-budget: ${PERSONALIZATION_ONLINE_GENERATION_BUDGET:45s}
  # Verifies Google ID tokens submitted by NATIVE apps (Flutter, WPF) to
  # POST /api/v1/auth/oauth2/google/token. NOT related to the web redirect flow in
  # spring.security.oauth2 above -- that flow is verified by Spring Security itself.
  oauth2:
    google:
      # List of OUR OWN client IDs accepted in the `aud` claim. If empty, every native Google
      # login is rejected (web is not affected).
      #
      # It must be COMPLETE because each client sends a different `aud`:
      #   - Flutter (Android/iOS) sends the WEB client ID -- that is what serverClientId of
      #     google_sign_in does, so this value is the SAME as GOOGLE_CLIENT_ID above;
      #   - WPF sends its own separate DESKTOP client ID.
      # Setting exactly one value means one of the two clients is always rejected.
      allowed-audiences: ${GOOGLE_ALLOWED_AUDIENCES:}
  frontend:
    password-setup-url: ${PASSWORD_SETUP_URL}
    oauth2-url: ${OAUTH2_URL}
    # Prefix of the notification redirect route (/n/{id}). If empty, web push is still sent
    # normally, but clicking it does not open the right item -- see FcmNotificationService.
    notification-url: ${NOTIFICATION_URL:}
  external-event:
    kafka:
      consumer-groups:
        user-service:
          topic:
            user-registered: ${KAFKA_USER_TOPIC:user.registered.v1}
          group-id: ${KAFKA_USER_GROUP_ID:vox-user}
        answer-turns:
          topic:
            answer-turns-recorded: ${KAFKA_ANSWER_TURNS_TOPIC:answer-turns-recorded}
          group-id: ${KAFKA_ANSWER_TURNS_GROUP_ID:vox-answer-turns}
        assessment-evaluation:
          topic:
            assessment-attempt-evaluation-completed: ${KAFKA_ASSESSMENT_EVALUATION_COMPLETED_TOPIC:assessment-attempt-evaluation-completed}
          group-id: ${KAFKA_ASSESSMENT_EVALUATION_GROUP_ID:vox-assessment-evaluation}
        practice-evaluation:
          topic:
            practice-attempt-evaluation-completed: ${KAFKA_PRACTICE_EVALUATION_COMPLETED_TOPIC:practice-attempt-evaluation-completed}
          group-id: ${KAFKA_PRACTICE_EVALUATION_GROUP_ID:vox-practice-evaluation}
        question-asset-analysis:
          topic:
            question-asset-analysis-completed: ${KAFKA_QUESTION_ASSET_ANALYSIS_COMPLETED_TOPIC:question-asset-analysis-completed}
          group-id: ${KAFKA_QUESTION_ASSET_ANALYSIS_GROUP_ID:vox-question-asset-analysis}
        recording:
          topic:
            recording-part-changed: ${KAFKA_RECORDING_PART_CHANGED_TOPIC:assessment.recording.part.changed}
          group-id: ${KAFKA_RECORDING_GROUP_ID:vox-recording}
        ai-usage:
          topic:
            ai-usage-recorded: ${KAFKA_AI_USAGE_TOPIC:assessment-ai-usage-recorded}
          group-id: ${KAFKA_AI_USAGE_GROUP_ID:vox-ai-usage}
        # Exam-monitoring alert emitted by vox-streaming (domain.TopicAlertRaised over there).
        proctoring-alert:
          topic:
            alert-raised: ${KAFKA_PROCTORING_ALERT_TOPIC:assessment.alert.raised}
          group-id: ${KAFKA_PROCTORING_ALERT_GROUP_ID:vox-proctoring-alert}
  internal-event:
    kafka: 
      consumer-groups:
        email:
          topic: 
            register-form-rejected: ${KAFKA_REGISTER_FORM_REJECTED_TOPIC:vox.register-form-rejected.v1}
            user-created: ${KAFKA_USER_CREATED_TOPIC:vox.user-created.v1}
            assessment-appeal: ${KAFKA_ASSESSMENT_APPEAL_TOPIC:vox.assessment-appeal.v1}
            assessment-result-lifecycle: ${KAFKA_ASSESSMENT_RESULT_LIFECYCLE_TOPIC:vox.assessment-result-lifecycle.v1}
            grading-assignment: ${KAFKA_GRADING_ASSIGNMENT_TOPIC:vox.grading-assignment.v1}
            invoice: ${KAFKA_INVOICE_TOPIC:vox.invoice.v1}
            school-debt: ${KAFKA_SCHOOL_DEBT_TOPIC:vox.school-debt.v1}
            # The two OTP topics are read by email only. Their payload does NOT contain the OTP code -- the code is
            # generated in the consumer right before the mail is sent, see EventTypeConstant.
            reset-password-otp: ${KAFKA_RESET_PASSWORD_OTP_TOPIC:vox.reset-password-otp.v1}
            register-verification-otp: ${KAFKA_REGISTER_VERIFICATION_OTP_TOPIC:vox.register-verification-otp.v1}
          group-id: ${KAFKA_EMAIL_GROUP_ID:vox-email}
        # Deliberately REUSES the email topic environment variables: the two groups must always read the same
        # topic, and splitting the variables means one side gets changed one day and they silently diverge.
        # register-form-rejected and user-created are missing on purpose: the recipient has no
        # account yet / has never logged in, so there is no device to push to.
        notification:
          topic:
            assessment-appeal: ${KAFKA_ASSESSMENT_APPEAL_TOPIC:vox.assessment-appeal.v1}
            assessment-result-lifecycle: ${KAFKA_ASSESSMENT_RESULT_LIFECYCLE_TOPIC:vox.assessment-result-lifecycle.v1}
            grading-assignment: ${KAFKA_GRADING_ASSIGNMENT_TOPIC:vox.grading-assignment.v1}
            assessment-blueprint-version: ${KAFKA_ASSESSMENT_BLUEPRINT_VERSION_TOPIC:vox.assessment-blueprint-version.v1}
            # DELIBERATELY no copy under the email group: the manual-grading reminder only shows in the app and is not
            # emailed. This is also why it does not share the grading-assignment topic --
            # GradingAssignmentEmailConsumer throws on an unknown eventType, so sharing would push every
            # message of this kind into the DLT.
            assessment-grading-review: ${KAFKA_ASSESSMENT_GRADING_REVIEW_TOPIC:vox.assessment-grading-review.v1}
            invoice: ${KAFKA_INVOICE_TOPIC:vox.invoice.v1}
            school-debt: ${KAFKA_SCHOOL_DEBT_TOPIC:vox.school-debt.v1}
          # Conversely, the group-id MUST be its own variable. Sharing KAFKA_EMAIL_GROUP_ID means that when that variable is set,
          # the two listeners fall into the same consumer group and Kafka delivers each message to only ONE of the two --
          # mail or notification, at random.
          group-id: ${KAFKA_NOTIFICATION_GROUP_ID:vox-notification}
  notification:
    # A device that disappears silently (app removed without logging out, browser data cleared) will
    # never receive UNREGISTERED from FCM, so this is the only cleanup path for it.
    # Set to 0 to disable the job.
    device-retention-days: ${NOTIFICATION_DEVICE_RETENTION_DAYS:90}
  recording:
    bucket: ${RECORDING_S3_BUCKET:}
  outbox:
    # Several eventTypes sharing one topic is intentional: the consumer branches on the
    # eventType header, so they are grouped by business area while each type keeps its own payload.
    # A key missing here compared to EventTypeConstant.all() stops the app from starting.
    topics:
      "[RegisterFormRejected]": ${KAFKA_REGISTER_FORM_REJECTED_TOPIC:vox.register-form-rejected.v1}
      "[UserCreated]": ${KAFKA_USER_CREATED_TOPIC:vox.user-created.v1}

      "[AssessmentAppealPublished]": ${KAFKA_ASSESSMENT_APPEAL_TOPIC:vox.assessment-appeal.v1}
      "[AssessmentAppealRejected]": ${KAFKA_ASSESSMENT_APPEAL_TOPIC:vox.assessment-appeal.v1}
      "[AssessmentAppealApproved]": ${KAFKA_ASSESSMENT_APPEAL_TOPIC:vox.assessment-appeal.v1}

      "[AssessmentResultReleased]": ${KAFKA_ASSESSMENT_RESULT_LIFECYCLE_TOPIC:vox.assessment-result-lifecycle.v1}
      "[AssessmentResultRegraded]": ${KAFKA_ASSESSMENT_RESULT_LIFECYCLE_TOPIC:vox.assessment-result-lifecycle.v1}
      "[AssessmentResultInvalidated]": ${KAFKA_ASSESSMENT_RESULT_LIFECYCLE_TOPIC:vox.assessment-result-lifecycle.v1}
      "[AssessmentResultInvalidCleared]": ${KAFKA_ASSESSMENT_RESULT_LIFECYCLE_TOPIC:vox.assessment-result-lifecycle.v1}
      "[AssessmentResultOutcomeDecided]": ${KAFKA_ASSESSMENT_RESULT_LIFECYCLE_TOPIC:vox.assessment-result-lifecycle.v1}

      "[GradingDeadlineReminder]": ${KAFKA_GRADING_ASSIGNMENT_TOPIC:vox.grading-assignment.v1}
      "[GradingAssignmentDeclined]": ${KAFKA_GRADING_ASSIGNMENT_TOPIC:vox.grading-assignment.v1}

      "[AssessmentBlueprintVersionPublished]": ${KAFKA_ASSESSMENT_BLUEPRINT_VERSION_TOPIC:vox.assessment-blueprint-version.v1}

      "[AssessmentHumanGradingRequired]": ${KAFKA_ASSESSMENT_GRADING_REVIEW_TOPIC:vox.assessment-grading-review.v1}
      "[GradingAssignmentOpened]": ${KAFKA_ASSESSMENT_GRADING_REVIEW_TOPIC:vox.assessment-grading-review.v1}

      "[InvoicePaid]": ${KAFKA_INVOICE_TOPIC:vox.invoice.v1}

      "[SchoolDebtCapExceeded]": ${KAFKA_SCHOOL_DEBT_TOPIC:vox.school-debt.v1}
      "[SchoolLockedDueToDebt]": ${KAFKA_SCHOOL_DEBT_TOPIC:vox.school-debt.v1}
      "[SchoolDebtCleared]": ${KAFKA_SCHOOL_DEBT_TOPIC:vox.school-debt.v1}
      "[SchoolQuotaUsageWarning]": ${KAFKA_SCHOOL_DEBT_TOPIC:vox.school-debt.v1}

      "[SchoolSubscriptionSuspended]": ${KAFKA_SCHOOL_DEBT_TOPIC:vox.school-debt.v1}
      "[SchoolSubscriptionUnsuspended]": ${KAFKA_SCHOOL_DEBT_TOPIC:vox.school-debt.v1}

      # The two OTP events: the payload carries only the recipient address, the code is generated in the consumer.
      "[ResetPasswordOtpRequested]": ${KAFKA_RESET_PASSWORD_OTP_TOPIC:vox.reset-password-otp.v1}
      "[RegisterVerificationOtpRequested]": ${KAFKA_REGISTER_VERIFICATION_OTP_TOPIC:vox.register-verification-otp.v1}
    


system-admin:
  email: ${SYS_ADMIN_EMAIL}
  password: ${SYS_ADMIN_PASSWORD}
  phone: ${SYS_ADMIN_PHONE}
  fullName: ${SYS_ADMIN_FULLNAME}
  dateOfBirth: ${SYS_ADMIN_DATE_OF_BIRTH}
  address: ${SYS_ADMIN_ADDRESS}

payos:
  client-id: ${PAYOS_CLIENT_ID:}
  api-key: ${PAYOS_API_KEY:}
  checksum-key: ${PAYOS_CHECKSUM_KEY:}
  return-url: ${PAYOS_RETURN_URL:}
  cancel-url: ${PAYOS_CANCEL_URL:}              

vox:
  quota:
    # PLACEHOLDER: used to estimate the worst-case AI cost (USD) before allowing
    # an exam to be scheduled -- see ClassTestTokenQuotaGuardService. This is NOT the
    # real cost (the real cost comes from ai_usage_record.cost_usd after the Agentic AI has
    # finished processing), only a temporary conversion factor used to block early when a school clearly lacks the
    # quota. It must be replaced with measured numbers (average cost_usd / audio_duration_seconds
    # over a long enough period) before use in production..
    estimated-cost-per-assessment-second-usd: ${VOX_QUOTA_ESTIMATED_COST_PER_ASSESSMENT_SECOND_USD:}
    # Same role as the line above but for PRACTICE only -- recomputed independently through
    # QuotaPricingCalibrationJob.runPractice(), see QuotaPricingCalibrationService/QuotaPricingSource.
    estimated-cost-per-practice-second-usd: ${VOX_QUOTA_ESTIMATED_COST_PER_PRACTICE_SECOND_USD:}
    calibration:
      # QuotaPricingCalibrationJob uses these values to recompute estimated-cost-per-assessment-second-usd
      # above from real ai_usage_record/assessment_item_responses data, instead of editing .env by hand --
      # see QuotaPricingCalibrationService.
      window-days: ${VOX_QUOTA_CALIBRATION_WINDOW_DAYS:}
      min-sample-sessions: ${VOX_QUOTA_CALIBRATION_MIN_SAMPLE_SESSIONS:}
      max-change-ratio: ${VOX_QUOTA_CALIBRATION_MAX_CHANGE_RATIO:}
      min-rate-bound: ${VOX_QUOTA_CALIBRATION_MIN_RATE_BOUND:}
      max-rate-bound: ${VOX_QUOTA_CALIBRATION_MAX_RATE_BOUND:}
    debt:
      # Warning threshold (does NOT block) when the debt (usedQuantity - totalAllocated) exceeds this ratio of
      # totalAllocated -- see QuotaDebtProperties/SchoolSubscriptionDebtGuardService.
      cap-ratio: ${VOX_QUOTA_DEBT_CAP_RATIO:}
    usage-warning:
      # EARLY warning (does NOT block) when used/totalAllocated exceeds this ratio -- see
      # QuotaUsageWarningProperties/ConsumeQuotaService.checkUsageWarningTransition.
      warning-ratio: ${VOX_QUOTA_USAGE_WARNING_RATIO:}
    selling-price:
      # Static fallback when there is no snapshot yet from ExchangeRateRefreshJob (just deployed) -- see
      # QuotaSellingPriceProperties/QuotaPricingService.
      usd-to-vnd-rate: ${VOX_QUOTA_USD_TO_VND_RATE:}
      # Service fee added to the quota amount on the ORDER (0.20 = 20%). Deliberately NOT pre-multiplied into
      # the exchange rate: combined, the school would see "1 USD = 31.200đ", which matches no real exchange rate -- see
      # QuotaPricingPort.serviceFeeRatio.
      service-fee-ratio: ${VOX_QUOTA_SERVICE_FEE_RATIO:}
    exchange-rate-api:
      # Real, free USD->VND exchange rate API, no key needed -- ExchangeRateRefreshJob calls it periodically to
      # store a new snapshot, see ExchangeRateApiProperties/ExchangeRateApiClient.
      base-url: ${VOX_EXCHANGE_RATE_API_BASE_URL:}
      # Safety guard: a fetch is treated as failed (no snapshot stored) if the returned rate falls outside
      # this range -- prevents one garbage API response from corrupting the real quota selling price.
      min-rate-bound: ${VOX_EXCHANGE_RATE_MIN_RATE_BOUND:}
      max-rate-bound: ${VOX_EXCHANGE_RATE_MAX_RATE_BOUND:}

sepay:
  pg:
    # SANDBOX | PRODUCTION. The URL of the checkout page and of the Open API are derived from this (see
    # SePayPaymentProperties.SePayEnvironment) — the two URLs must always be in the same environment, and declaring
    # each separately opens the way for a deploy that forgets to change one line.
    env: ${SEPAY_ENV:SANDBOX}
    merchant-id: ${SEPAY_MERCHANT_ID:}
    # HMAC signing key of the checkout form, also the Basic auth password when calling the Open API.
    secret-key: ${SEPAY_SECRET_KEY:}
    # Value of the X-Secret-Key header on the IPN, set separately in the dashboard (Payment Gateway -> Configuration ->
    # IPN). Do NOT reuse secret-key: that would send the signing key over the network on every IPN call from SePay.
    ipn-secret-key: ${SEPAY_IPN_SECRET_KEY:}
    # BANK_TRANSFER (VietQR) | NAPAS_BANK_TRANSFER | CARD
    payment-method: ${SEPAY_PAYMENT_METHOD:BANK_TRANSFER}
    # Root of the FE routes /payment/success|error|cancel that SePay redirects the user back to.
    return-base-url: ${SEPAY_RETURN_BASE_URL:${BASE_URL:}}

firebase:
  # Disabled by default: the FirebaseApp bean throws when there is no service account, so if it were
  # enabled by default every machine without configured credentials could not start the app or the tests.
  # When disabled, NoOpPushNotificationService stands in for PushNotificationPort.
  enabled: ${FIREBASE_ENABLED:false}
  credentials:
    # Path to the service account .json file. Accepts a bare absolute path
    # (C:\... or /etc/...) -- FirebaseConfig adds the file: scheme itself -- and also a form that already has
    # a scheme such as classpath:firebase/service-account.json.
    # Note that it must point at the .json FILE itself, not the directory containing it.
    path: ${FIREBASE_CREDENTIALS_PATH:}
    # Alternative to path for container deployments that cannot mount a file: paste the
    # service account content directly, as raw JSON or base64.
    json: ${FIREBASE_CREDENTIALS_JSON:}

demo-data: 
  enabled: ${DEMO_DATA_ENABLED:false}
  password: ${DEMO_DATA_PASSWORD:Password@123}