spring:
  application:
    name: vox

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  threads:
    virtual:
      enabled: true
  graphql:
    graphiql:
      enabled: true

  grpc:
    server: 
      port: 9090
      health:
        enabled: true
      reflection:
        enabled: true
          
    client: 
      channel:
        greeter: 
          target: 0.0.0.0:9090
          inbound: 
            message:
              max-size: 8MB

  flyway: 
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      acks: all # wait for all replicas
      retries: 3 # retry on transient failure
      batch-size: 16KB # 16KB default
      buffer-memory: 32MB # 32MB producer buffer
      compression-type: zstd # compression-ration=high, speed=fast, cpu-usage=moderate
      properties:
        "[enable.idempotence]": true
    consumer:
      group-id: ${KAFKA_GROUP_ID:vox}
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      max-poll-records: 50 # max records per pools
      max-poll-interval: 10m # 10 min
      fetch-min-size: 1
      fetch-max-wait: 500ms
      auto-offset-reset: earliest
      properties:
        "[spring.json.trusted.packages]": "com.sep.vox"
        "[session.timeout.ms]": 30000
        "[heartbeat.interval.ms]": 10000
        "[spring.deserializer.value.delegate.class]": org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        "[spring.json.use.type.headers]": false
        # Python producers (agents' aiokafka) never send Spring's type-info headers, so
        # JacksonJsonDeserializer has nothing to fall back to and throws IllegalStateException
        # before any @KafkaListener body runs. Fall back to a generic map when headers are
        # absent; listeners already treat record.value() as Object and re-parse it themselves
        # (jsonMapper.valueToTree(...).treeToValue(...)). Headers are still honored when present,
        # so Java-to-Java producers/consumers (e.g. DummyUserRegisteredExternalEvent) are unaffected.
        "[spring.json.value.default.type]": "java.util.LinkedHashMap"

    listener:
      ack-mode: MANUAL_IMMEDIATE # commit right away
      concurrency: 3 # 3 threads
      poll-timeout: 3000ms
      type: single
    streams:
      application-id: "vox"
      auto-startup: true
    properties:
      "[prop.shared]": "value"
    admin:
      properties:
        "[prop.admin]": "value"
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: ${REDIS_TIMEOUT:2s}

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          # Không có timeout thì thread gửi mail treo vô hạn khi SMTP không phản hồi —
          # queue mail đầy dần và (với CallerRunsPolicy) thread import bị giữ luôn.
          connectiontimeout: 5000
          timeout: 10000
          writetimeout: 10000

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - profile
              - email
              - openid

  datasource:
    url: jdbc:postgresql://${DB_URL}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      pool-name: vox-hikari
      # Log kèm stack trace nếu 1 connection bị giữ >5s — cho biết đúng request/repo nào
      # đang ôm connection khiến các request khác phải xếp hàng chờ rồi timeout.
      leak-detection-threshold: 5000
      # Mặc định Spring Boot chỉ 10 — quá ít khi nhiều tab/request đồng thời cùng gọi
      # GraphQL (mỗi request giữ 1 connection suốt thời gian resolve). Postgres cho phép
      # tới 100 connection, còn dư nhiều nên tăng lên đây để giảm nghẽn hàng đợi.
      maximum-pool-size: 25
      minimum-idle: 5

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: true

storage:
  provider: ${STORAGE_PROVIDER:}
  s3:
    bucket: ${AWS_S3_BUCKET:}
    region: ${AWS_REGION:ap-southeast-1}
    endpoint: ${AWS_S3_ENDPOINT:}
    access-key: ${AWS_ACCESS_KEY_ID:}
    secret-key: ${AWS_SECRET_ACCESS_KEY:}
    key-prefix: ${AWS_S3_KEY_PREFIX:}
    public-base-url: ${AWS_S3_PUBLIC_BASE_URL:}
    path-style-access-enabled: ${AWS_S3_PATH_STYLE:false}

springdoc:
  swagger-ui:
    path: /api-doc.html
    enabled: true
  api-docs:
    path: /v3/api-spec


jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 1800000
  stream:
    secret: ${JWT_STREAM_SECRET}

logging:
  file: 
    name: logs/vox.log
  logback: 
    rollingpolicy:
      max-file-size: 20MB
      max-history: 7
  level:
    org:
      springframework:
        security: DEBUG
        kafka: WARN
        core: 
          annotation: 
            MergedAnnotation: ERROR
      apache: 
        kafka: WARN


server:
  port: 8081
  shutdown: graceful
  forward-headers-strategy: framework

app:
  data-initializer: 
    enabled: ${DATA_INITIALIZER:true}
  frontend:
    password-setup-url: ${PASSWORD_SETUP_URL}
    oauth2-url: ${OAUTH2_URL}
  external-event:
    kafka:
      consumer-groups:
        user-service:
          topic:
            user-registered: ${KAFKA_USER_TOPIC:user.registered.v1}
          group-id: ${KAFKA_USER_GROUP_ID:vox-user}
        answer-turns:
          topic:
            answer-turns-recorded: ${KAFKA_ANSWER_TURNS_TOPIC:answer-turns-recorded}
          group-id: ${KAFKA_ANSWER_TURNS_GROUP_ID:vox-answer-turns}
        exam-evaluation:
          topic:
            exam-attempt-evaluation-completed: ${KAFKA_EXAM_EVALUATION_COMPLETED_TOPIC:exam-attempt-evaluation-completed}
          group-id: ${KAFKA_EXAM_EVALUATION_GROUP_ID:vox-exam-evaluation}
        question-asset-analysis:
          topic:
            question-asset-analysis-completed: ${KAFKA_QUESTION_ASSET_ANALYSIS_COMPLETED_TOPIC:question-asset-analysis-completed}
          group-id: ${KAFKA_QUESTION_ASSET_ANALYSIS_GROUP_ID:vox-question-asset-analysis}
        recording:
          topic:
            recording-part-changed: ${KAFKA_RECORDING_PART_CHANGED_TOPIC:exam.recording.part.changed}
          group-id: ${KAFKA_RECORDING_GROUP_ID:vox-recording}
  internal-event: 
    kafka: 
      consumer-groups:
        email:
          topic: 
            register-form-rejected: ${KAFKA_REGISTER_FORM_REJECTED_TOPIC:vox.register-form-rejected.v1}
            user-created: ${KAFKA_USER_CREATED_TOPIC:vox.user-created.v1}
            exam-appeal: ${KAFKA_EXAM_APPEAL_TOPIC:vox.exam-appeal.v1}
            exam-result-lifecycle: ${KAFKA_EXAM_RESULT_LIFECYCLE_TOPIC:vox.exam-result-lifecycle.v1}
            grading-assignment: ${KAFKA_GRADING_ASSIGNMENT_TOPIC:vox.grading-assignment.v1}
          group-id: ${KAFKA_EMAIL_GROUP_ID:vox-email}
  recording:
    bucket: ${RECORDING_S3_BUCKET:}
  outbox:
    # Nhiều eventType trỏ chung một topic là có chủ ý: consumer phân nhánh bằng header
    # eventType, nên gom theo nhóm nghiệp vụ mà mỗi loại vẫn giữ payload riêng.
    # Thiếu một key ở đây so với EventTypeConstant.all() là app không khởi động được.
    topics:
      "[RegisterFormRejected]": ${KAFKA_REGISTER_FORM_REJECTED_TOPIC:vox.register-form-rejected.v1}
      "[UserCreated]": ${KAFKA_USER_CREATED_TOPIC:vox.user-created.v1}

      "[ExamAppealPublished]": ${KAFKA_EXAM_APPEAL_TOPIC:vox.exam-appeal.v1}
      "[ExamAppealRejected]": ${KAFKA_EXAM_APPEAL_TOPIC:vox.exam-appeal.v1}
      "[ExamAppealApproved]": ${KAFKA_EXAM_APPEAL_TOPIC:vox.exam-appeal.v1}

      "[ExamResultReleased]": ${KAFKA_EXAM_RESULT_LIFECYCLE_TOPIC:vox.exam-result-lifecycle.v1}
      "[ExamResultRegraded]": ${KAFKA_EXAM_RESULT_LIFECYCLE_TOPIC:vox.exam-result-lifecycle.v1}
      "[ExamResultInvalidated]": ${KAFKA_EXAM_RESULT_LIFECYCLE_TOPIC:vox.exam-result-lifecycle.v1}
      "[ExamResultInvalidCleared]": ${KAFKA_EXAM_RESULT_LIFECYCLE_TOPIC:vox.exam-result-lifecycle.v1}
      "[ExamResultOutcomeDecided]": ${KAFKA_EXAM_RESULT_LIFECYCLE_TOPIC:vox.exam-result-lifecycle.v1}

      "[GradingDeadlineReminder]": ${KAFKA_GRADING_ASSIGNMENT_TOPIC:vox.grading-assignment.v1}
      "[GradingAssignmentDeclined]": ${KAFKA_GRADING_ASSIGNMENT_TOPIC:vox.grading-assignment.v1}
    


system-admin:
  email: ${SYS_ADMIN_EMAIL}
  password: ${SYS_ADMIN_PASSWORD}
  phone: ${SYS_ADMIN_PHONE}
  fullName: ${SYS_ADMIN_FULLNAME}
  dateOfBirth: ${SYS_ADMIN_DATE_OF_BIRTH}
  address: ${SYS_ADMIN_ADDRESS}

payos:
  client-id: ${PAYOS_CLIENT_ID:}
  api-key: ${PAYOS_API_KEY:}
  checksum-key: ${PAYOS_CHECKSUM_KEY:}
  return-url: ${PAYOS_RETURN_URL:}
  cancel-url: ${PAYOS_CANCEL_URL:}
  system-admin-return-url: ${PAYOS_SYSTEM_ADMIN_RETURN_URL:}
  system-admin-cancel-url: ${PAYOS_SYSTEM_ADMIN_CANCEL_URL:}
