spring:
  application:
    name: vox

  threads:
    virtual:
      enabled: true
  graphql:
    graphiql:
      enabled: true


  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: ${REDIS_TIMEOUT:2s}

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  security:
    oauth2:
      client:
        registration:
          google: 
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - profile
              - email
          
  datasource:
    url: jdbc:postgresql://${DB_URL}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true

springdoc:
  swagger-ui:
    path: /api-doc.html
    enabled: true
  api-docs:
    path: /v3/api-spec


jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 1800000

logging:
  level:
    org:
      springframework:
        security: DEBUG

server:
  port: 8080
  shutdown: graceful
  forward-headers-strategy: framework

app:
  frontend:
    password-setup-url: ${PASSWORD_SETUP_URL}
    oauth2-success-url: ${OAUTH2_SUCCESS_URL}

system-admin:
  email: ${SYS_ADMIN_EMAIL}
  password: ${SYS_ADMIN_PASSWORD}
  phone: ${SYS_ADMIN_PHONE}
  fullName: ${SYS_ADMIN_FULLNAME}
  dateOfBirth: ${SYS_ADMIN_DATE_OF_BIRTH}
  address: ${SYS_ADMIN_ADDRESS}