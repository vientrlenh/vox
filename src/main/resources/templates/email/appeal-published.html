<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kết quả phúc khảo đã được công bố - VOX</title>
</head>
<body style="margin:0; padding:0; background:#07115a; font-family:Arial, Helvetica, sans-serif; color:#ffffff;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#07115a; margin:0; padding:0;">
    <tr>
      <td align="center" style="padding:32px 16px;">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width:640px; overflow:hidden; border-radius:28px; background:#081166;">
          <tr>
            <td style="padding:0; background:linear-gradient(135deg, #061158 0%, #1021a4 48%, #6c1fff 100%);">
              <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0">
                <tr>
                  <td style="padding:40px 40px 24px;">
                    <div style="font-size:42px; line-height:1; font-weight:800; letter-spacing:0; color:#ffffff;">VOX</div>
                  </td>
                </tr>
                <tr>
                  <td style="padding:8px 40px 32px;">
                    <div style="font-size:34px; line-height:1.2; font-weight:700; color:#ffffff;">Kết quả phúc khảo đã được công bố</div>
                    <div style="height:12px;"></div>
                    <div style="font-size:18px; line-height:1.6; color:#d8defe;">
                      Hội đồng đã chấm lại bài thi của bạn cho kỳ thi <strong>{{examName}}</strong>. Đây là kết quả cuối cùng.
                    </div>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <tr>
            <td style="padding:0 24px 24px; background:linear-gradient(180deg, #081166 0%, #111a7a 100%);">
              <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background:#ffffff; border-radius:24px;">
                <tr>
                  <td style="padding:36px 32px 12px; color:#111633;">
                    <div style="font-size:24px; line-height:1.3; font-weight:700;">Điểm sau phúc khảo</div>
                  </td>
                </tr>
                <tr>
                  <td style="padding:20px 32px 28px;">
                    <div style="padding:18px 20px; border-radius:16px; background:#eef2ff; border:1px solid #c7d2fe; color:#1e293b; font-size:16px; line-height:1.7;">
                      Điểm trước phúc khảo: {{scoreBefore}}<br>
                      <strong>Điểm sau phúc khảo: {{scoreAfter}}</strong>
                    </div>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <tr>
            <td style="padding:4px 40px 36px; background:#111a7a;">
              <div style="text-align:center; font-size:13px; line-height:1.6; color:#aeb8ef;">
                © 2026 VOX. Tất cả quyền được bảo lưu.
              </div>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
