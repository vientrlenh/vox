spring:
    # Dynamic port: application.yaml fixes gRPC at 9090, so every @SpringBootTest dies with a
    # BindException when the machine is already running the app (bootRun/IDE). Tests do not call gRPC, so it is set to 0.
    grpc:
        server:
            port: 0

    boot:
        admin:
            client:
                # Same family as the kafka block below: stops tests from talking outside the process.
                #
                # Today this client does not run in tests because every @SpringBootTest uses
                # webEnvironment MOCK, with no real WebServer, so WebServerInitializedEvent
                # is never published and ApplicationRegistrator does not start. But it is only
                # one word away from RANDOM_PORT: add a single test that needs real HTTP and the client starts
                # and POSTs to spring.boot.admin.client.url -- that address is hardcoded to
                # localhost:8081, i.e. the REAL app running on the dev machine, once every 10 seconds.
                # The result is a ghost instance in the real app's admin page, pointing at a
                # port that was closed as soon as the test ended.
                enabled: false

    # Kafka isolation. ContainerTestConfig only builds a testcontainer for Postgres, there is NO
    # Kafka container -- so without a guard here every @SpringBootTest would connect straight to the
    # real broker of the dev machine (spring.kafka.bootstrap-servers defaults to localhost:9092).
    #
    # from offset 0 with the exact production group-id, look up exam sessions in the empty testcontainer DB and
    # fail all of them, then push every event to the DLT. For the real app those events count as already
    # consumed and are lost forever.
    kafka:
        listener:
            # Main guard: no listener container starts, so nothing is read and lost.
            auto-startup: false
        admin:
            # @RetryableTopic(autoCreateTopics="true") registers NewTopic beans; KafkaAdmin would create
            # them on the real broker while the context is built even though no listener runs.
            auto-create: false
        consumer:
            # Last guard, in case a test starts a listener itself: do not rewind the topic history.
            auto-offset-reset: latest

    jpa:
        database-platform: org.hibernate.dialect.H2Dialect
        hibernate:
            ddl-auto: create-drop
        show-sql: false
        properties:
            hibernate:
                format-sql: false
    datasource:
        hikari:
            maximum-pool-size: 2
            minimum-idle: 0

    mail:
        username: test@assessmentple.com
        password: test-password

jwt:
    secret: test-access-secret-oooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooo
    stream: 
        secret: testsecretoooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooo

system-admin:
  email: sysadmin@assessmentple.com
  password: TestPassword123!
  phone: 0987654321
  fullName: System Admin
  dateOfBirth: 1990-01-01
  address: Test Address

app:
  # REQUIRED, not a convenience. SecurityConfig#adminConsoleFilterChain calls
  # requireConfigured() and throws IllegalStateException when these two keys are empty, so without them
  # EVERY @SpringBootTest dies while building the context instead of failing a single assert.
  #
  # On a dev machine .env hides this error (SBA_ADMIN_* are already in the environment), but CI
  # only sets SPRING_DATASOURCE_* and JWT_SECRET -- see .github/workflows/ci-build.yml. The values
  # below are fixed junk: tests never call /admin/**, so the content does not matter, it only has to be
  # non-empty.
  admin:
    username: test-admin
    password: test-admin-password

  frontend:
    password-setup-url: http://localhost:5173/test-password-setup-url
    oauth2-url: http://localhost:5173/oauth2-callback

  # OutboxEventScheduler runs every second and pushes every outbox row to Kafka. @EnableScheduling
  # is on in tests, so a single test that writes an outbox row lets a fake event leak into a
  # real topic -- the reverse direction of the same leak that the spring.kafka block above stops.
  outbox:
    scheduler:
      enabled: false

  # Each @KafkaListener declares its groupId through the keys below, NOT from
  # spring.kafka.consumer.group-id -- so overriding that key is useless, each one must be overridden separately.
  # By default they equal the exact production group-id (vox-recording, vox-email...), meaning a test would
  # commit offsets straight into the group the real app uses. This is the second line of defence, in case
  # a test starts a listener itself through KafkaListenerEndpointRegistry.
  external-event:
    kafka:
      consumer-groups:
        user-service:
          group-id: vox-test-user
        answer-turns:
          group-id: vox-test-answer-turns
        assessment-evaluation:
          group-id: vox-test-assessment-evaluation
        practice-evaluation:
          group-id: vox-test-practice-evaluation
        question-asset-analysis:
          group-id: vox-test-question-asset-analysis
        recording:
          group-id: vox-test-recording
  internal-event:
    kafka:
      consumer-groups:
        email:
          group-id: vox-test-email
        notification:
          group-id: vox-test-notification
